<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SimpleMail</title>
  <style>
    :root { --ink:#1f2933; --muted:#5f6b7a; --line:#d5dbe3; --accent:#1f3a5f; --ok:#1d7a46; --err:#b42318; --bg:#f6f7f9; }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { max-width:560px; margin:48px auto; padding:0 16px; }
    h1 { font-size:24px; margin:0 0 4px; color:var(--accent); }
    p.lead { margin:0 0 24px; color:var(--muted); }
    form { background:#fff; border:1px solid var(--line); border-radius:12px; padding:24px; }
    label { display:block; font-weight:600; font-size:14px; margin:16px 0 6px; }
    label:first-of-type { margin-top:0; }
    input, textarea { width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:8px; font:inherit; }
    textarea { min-height:140px; resize:vertical; }
    input:focus, textarea:focus { outline:2px solid var(--accent); outline-offset:1px; }
    button { margin-top:20px; width:100%; padding:12px; border:0; border-radius:8px; background:var(--accent); color:#fff; font:inherit; font-weight:600; cursor:pointer; }
    button:disabled { opacity:.6; cursor:wait; }
    #result { margin-top:16px; font-size:14px; }
    #result.ok { color:var(--ok); }
    #result.err { color:var(--err); }
    #result ul { margin:4px 0 0; padding-left:20px; }
  </style>
</head>
<body>
<main>
  <h1>SimpleMail</h1>
  <p class="lead">Send an email through the SimpleMail service.</p>

  <form id="email-form" novalidate>
    <label for="from">Sender email</label>
    <input id="from" name="from" type="email" placeholder="you@example.com" required>

    <label for="to">Recipient email</label>
    <input id="to" name="to" type="email" placeholder="friend@example.com" required>

    <label for="subject">Subject</label>
    <input id="subject" name="subject" type="text" maxlength="200" required>

    <label for="body">Message</label>
    <textarea id="body" name="body" maxlength="10000" required></textarea>

    <button type="submit" id="send">Send</button>
    <div id="result" role="status" aria-live="polite"></div>
  </form>
</main>

<script>
  const form = document.getElementById('email-form');
  const result = document.getElementById('result');
  const button = document.getElementById('send');

  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    button.disabled = true;
    result.className = '';
    result.textContent = 'Sending...';

    const payload = Object.fromEntries(new FormData(form).entries());

    try {
      const response = await fetch('/api/emails', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      const data = await response.json();

      if (response.ok) {
        result.className = 'ok';
        result.textContent = 'Email sent.';
        form.reset();
      } else if (data.errors) {
        result.className = 'err';
        result.innerHTML = 'Please fix the following:<ul></ul>';
        const list = result.querySelector('ul');
        data.errors.forEach(message => {
          const item = document.createElement('li');
          item.textContent = message;
          list.appendChild(item);
        });
      } else {
        result.className = 'err';
        result.textContent = data.error || 'Something went wrong.';
      }
    } catch (error) {
      result.className = 'err';
      result.textContent = 'Could not reach the server.';
    } finally {
      button.disabled = false;
    }
  });
</script>
</body>
</html>
