# Credentials live in a Secret, not the ConfigMap.
# These are dummy values for Mailpit, which needs no login.
# In a real environment this file would NOT be committed: the Secret would be created by the
# pipeline or synced from a secrets manager (AWS Secrets Manager, Vault, Sealed Secrets).
apiVersion: v1
kind: Secret
metadata:
  name: simplemail-smtp
  namespace: simplemail
type: Opaque
stringData:
  SMTP_USERNAME: "demo"
  SMTP_PASSWORD: "demo"
