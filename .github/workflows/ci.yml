# SimpleMail CI/CD pipeline
#
# Stage 1 (test):   compile and run the unit tests with Maven.
# Stage 2 (deliver): build the Docker image, scan it with Trivy,
#                    deploy it to a throwaway kind cluster, smoke test it
#                    end to end (send an email, check Mailpit received it),
#                    then push the image to GitHub Container Registry
#                    (only on pushes to main, never on pull requests).

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/simplemail
  TRIVY_VERSION: "0.58.1"

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Compile, test and package
        run: mvn -B verify

  deliver:
    name: Image, scan, deploy, smoke test
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Build the Docker image
        run: docker build -t simplemail:dev .

      - name: Scan the image with Trivy (fail on fixable HIGH/CRITICAL)
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:${TRIVY_VERSION} image \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            simplemail:dev

      - name: Create a kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: simplemail

      - name: Load the image into kind
        run: kind load docker-image simplemail:dev --name simplemail

      - name: Deploy to Kubernetes
        run: |
          kubectl create namespace simplemail
          kubectl apply -f k8s/
          kubectl -n simplemail rollout status deployment/mailpit --timeout=120s
          kubectl -n simplemail rollout status deployment/simplemail --timeout=180s
          kubectl -n simplemail get pods,svc

      - name: Smoke test (health check, send an email, check Mailpit)
        run: |
          kubectl -n simplemail port-forward svc/simplemail 8080:80 >/dev/null 2>&1 &
          kubectl -n simplemail port-forward svc/mailpit 8025:8025 >/dev/null 2>&1 &
          sleep 5

          curl -fsS http://localhost:8080/actuator/health | tee /dev/stderr | grep -q '"UP"'

          curl -fsS -X POST http://localhost:8080/api/emails \
            -H 'Content-Type: application/json' \
            -d '{"from":"ci@example.com","to":"test@example.com","subject":"CI smoke test","body":"Sent by GitHub Actions"}'
          echo

          sleep 2
          total=$(curl -fsS http://localhost:8025/api/v1/messages | jq '.total')
          echo "Mailpit has $total message(s)"
          test "$total" -ge 1

      - name: Show pod logs if anything failed
        if: failure()
        run: |
          kubectl -n simplemail get pods -o wide || true
          kubectl -n simplemail describe pods || true
          kubectl -n simplemail logs deployment/simplemail --all-containers || true

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the image to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag simplemail:dev ${IMAGE_NAME}:${GITHUB_SHA::7}
          docker tag simplemail:dev ${IMAGE_NAME}:latest
          docker push ${IMAGE_NAME}:${GITHUB_SHA::7}
          docker push ${IMAGE_NAME}:latest
